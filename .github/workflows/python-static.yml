name: Python rules engine and position analysis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the Python rules engine and evaluator
        run: python -m py_compile rithmomachia_compat.py rithmomachia.py position_analysis.py
      - name: Run CPython integration and regression tests
        run: python -m unittest discover -s tests -v
